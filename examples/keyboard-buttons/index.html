<!DOCTYPE html>
<html><head><meta charset=utf-8><title>RWE Keyboard Buttons</title>
<link rel=stylesheet href=style.css></head><body>
<h1>KEYBOARD BUTTONS</h1>
<p>Tab / Shift+Tab: focus. Enter / Space: activate.</p>
<p id=count>COUNT: 0</p>
<button id=increment>INCREMENT</button>
<button id=disabled disabled>DISABLED: SKIPPED BY TAB</button>
<button id=decrement>DECREMENT</button>
<button id=reset>RESET</button>
<p id=focus>FOCUS: NONE</p>
<p>Press R to reset. The app handles this key.</p>
<script src=app.js></script></body></html>
