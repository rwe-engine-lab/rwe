<!DOCTYPE html>
<html><head><meta charset=utf-8><title>RWE Text Input</title>
<link rel=stylesheet href=style.css></head><body>
<h1>TEXT INPUT</h1>
<p>Tab: focus. Type to edit. Arrows: move caret.</p>
<p>Shift+Arrows: select. Ctrl/Cmd+A: select all.</p>
<input id=name type=text placeholder="YOUR NAME" maxlength=40>
<p id=preview>HELLO, STRANGER</p>
<input id=readonly type=text readonly value="READ ONLY">
<button id=clear>CLEAR</button>
<p id=status>EDIT YOUR NAME, THEN PRESS ENTER OR TAB.</p>
<script src=app.js></script></body></html>
