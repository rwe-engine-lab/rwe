<!DOCTYPE html>
<html><head><meta charset=utf-8><title>RWE 中文输入</title>
<link rel=stylesheet href=style.css></head><body>
<h1>中文显示与输入</h1>
<p>你好，世界！这是由 RWE 自己绘制的中文界面。</p>
<p>请点击输入框，使用中文输入法。Tab 切换焦点。</p>
<input id=name type=text placeholder="请输入你的名字" maxlength=40>

<p>中英混排：RWE 框架 / Rust + Vue + React</p>
<script src=app.js></script></body></html>
